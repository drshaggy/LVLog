name: LabVIEW CI
run-name: LabVIEW container CI • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labview-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the LabVIEW release so a new "latest" image cannot silently change CI.
  LABVIEW_IMAGE: nationalinstruments/labview:2026q1patch2-linux

jobs:
  build-and-test:
    name: Build and test (LabVIEW 2026 Q1 Patch 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare pinned LabVIEW dependencies
        run: .github/scripts/prepare-labview-dependencies.sh

      - name: Pull LabVIEW container
        run: docker pull "$LABVIEW_IMAGE"

      - name: Mass compile, build PPL, and run LUnit
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --env CI=true \
            --env WORKSPACE=/workspace \
            "$LABVIEW_IMAGE" \
            bash /workspace/.github/scripts/run-labview-ci.sh

      - name: Validate LUnit report
        if: always()
        run: python3 .github/scripts/check-lunit-report.py test-results/lunit.xml

      - name: Upload LabVIEW outputs
        if: always()
        id: labview-artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvlog-labview-2026q1-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            builds/**/*.lvlibp
            build-logs/**
            test-results/**

      - name: Publish durable run evidence
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.labview-artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.labview-artifact.outputs.artifact-url }}
        run: |
          {
            echo
            echo "## CI evidence"
            echo
            echo "- Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Commit: \`${GITHUB_SHA}\`"
            if [[ -n "$ARTIFACT_DIGEST" ]]; then
              echo "- Artifact SHA-256: \`${ARTIFACT_DIGEST}\`"
            fi
            if [[ -n "$ARTIFACT_URL" ]]; then
              echo "- Artifact: [PPL, XML report, and logs (GitHub access required)](${ARTIFACT_URL})"
            fi
            echo
            echo "Artifact contents include:"
            echo
            echo "- \`builds/LV Logging/LVLog PPL/LVLog.lvlibp\`"
            echo "- \`test-results/lunit.xml\`"
            echo "- \`build-logs/\`"
          } >> "$GITHUB_STEP_SUMMARY"
